<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Experiment 4 - Shopping Cart Page</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; padding: 20px; }
        .cart-container { width: 80%; margin: 20px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { color: #1e3c72; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background-color: #f1f3f5; }
        .total-box { text-align: right; font-size: 18px; font-weight: bold; color: #1e3c72; }
        .checkout-btn { background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; float: right; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="cart-container">
        <h2>Your Shopping Cart</h2>
        <table>
            <thead>
                <tr>
                    <th>Item Description</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Core Java: An Integrated Approach</td>
                    <td>₹650.00</td>
                    <td>1</td>
                    <td>₹650.00</td>
                </tr>
                <tr>
                    <td>Operating System Concepts</td>
                    <td>₹850.00</td>
                    <td>2</td>
                    <td>₹1,700.00</td>
                </tr>
            </tbody>
        </table>

        <div class="total-box">
            Grand Total: ₹2,350.00
        </div>
        <button class="checkout-btn">Proceed to Checkout</button>
        <div style="clear: both;"></div>
    </div>

</body>
</html>
