<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Experiment 2 - Login Page</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f6f9; }
        .header { background: #1e3c72; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        nav { background: #333; padding: 10px 20px; }
        nav a { color: white; text-decoration: none; margin-right: 15px; }
        
        .login-box {
            width: 360px; margin: 60px auto; background: white; padding: 25px;
            border-radius: 8px; box-shadow: 0px 4px 10px rgba(0,0,0,0.15);
            border-top: 4px solid #1e3c72;
        }
        .login-box h2 { text-align: center; margin-bottom: 20px; color: #1e3c72; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-container { display: flex; justify-content: space-between; margin-top: 20px; }
        .btn { padding: 8px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-submit { background: #28a745; color: white; }
        .btn-reset { background: #dc3545; color: white; }
    </style>
</head>
<body>

    <div class="header">
        <h1>GLB Book Store</h1>
        <span>ECE | CSE | EEE | CIVIL</span>
    </div>
    <nav>
        <a href="#">Home</a> <a href="#">Login</a> <a href="#">Registration</a> <a href="#">Catalogue</a> <a href="#">Cart</a>
    </nav>

    <div class="login-box">
        <h2>User Login</h2>
        <form>
            <div class="form-group">
                <label for="username">User Name:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="btn-container">
                <input type="reset" class="btn btn-reset" value="Reset">
                <input type="submit" class="btn btn-submit" value="Submit">
            </div>
        </form>
    </div>

</body>
</html>
